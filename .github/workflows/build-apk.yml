
name: Build Neel Khame APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Extract project
        run: unzip -o Neel_Khame_Android_Project.zip

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p Neel_Khame_Android_Project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: neel-khame-apk
          path: Neel_Khame_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          
